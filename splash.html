<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Banking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0066cc 0%, #00a8ff 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.5s ease-in;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            animation: scaleIn 0.6s ease-out;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        }

        .brand-text {
            color: white;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            animation: slideUp 0.7s ease-out 0.2s backwards;
        }

        .loading {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 8px;
            animation: slideUp 0.7s ease-out 0.4s backwards;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: pulse 1.4s infinite;
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 60%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            30% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .message {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 30px;
            animation: slideUp 0.7s ease-out 0.6s backwards;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">
            <img src="{{ url_for('favicon') }}" alt="Smart Banking Logo">
        </div>
        <div class="brand-text">Smart Banking</div>
        <div class="loading">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="message">Secure Banking Solutions</div>
    </div>

    <script>
        // Redirect to home page after 2.5 seconds
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.location.href = '{{ url_for("home") }}?splash=done';
            }, 2500); // 2.5 seconds
        });
    </script>
</body>
</html>
